name: Vindvarsel Vestfjorden

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: wind-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run wind agent
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MET_USER_AGENT: ${{ secrets.MET_USER_AGENT }}
          WIND_THRESHOLD_MS: ${{ vars.WIND_THRESHOLD_MS }}
        run: python -m wind_agent.check_wind

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "wind-agent"
          git config user.email "wind-agent@users.noreply.github.com"
          git add wind_agent/state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "chore(state): update dedup state [skip ci]"
            git push
          fi
