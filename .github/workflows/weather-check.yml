name: Vindvarsel Vestfjorden

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

concurrency:
  group: wind-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run wind agent
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MET_USER_AGENT: ${{ secrets.MET_USER_AGENT }}
          FROST_CLIENT_ID: ${{ secrets.FROST_CLIENT_ID }}
          WIND_THRESHOLD_MS: ${{ vars.WIND_THRESHOLD_MS }}
          CERBO_MQTT_URL: ${{ secrets.CERBO_MQTT_URL }}
          CERBO_MQTT_USERNAME: ${{ secrets.CERBO_MQTT_USERNAME }}
          CERBO_MQTT_PASSWORD: ${{ secrets.CERBO_MQTT_PASSWORD }}
          CERBO_MQTT_TOPIC_FILTER: ${{ vars.CERBO_MQTT_TOPIC_FILTER }}
          CERBO_MQTT_FRESH_MAX_MIN: ${{ vars.CERBO_MQTT_FRESH_MAX_MIN }}
          CERBO_SOURCE_NAME: ${{ vars.CERBO_SOURCE_NAME }}
          CERBO_MAGNETIC_DECLINATION_DEG: ${{ vars.CERBO_MAGNETIC_DECLINATION_DEG }}
        run: python -m wind_agent.check_wind

      - name: Commit updated state
        if: always()
        run: |
          git config user.name "wind-agent"
          git config user.email "wind-agent@users.noreply.github.com"
          git add wind_agent/state.json
          if git diff --cached --quiet; then
            echo "No state changes to commit"
          else
            git commit -m "chore(state): update dedup state [skip ci]"
            git push
          fi
